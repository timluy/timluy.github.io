<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Luyobya Timothy</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0a192f; --accent: #64ffda; --muted: #8892b0; --text: #ccd6f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Exo 2', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .err-code {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(5rem, 20vw, 10rem);
      color: var(--accent); opacity: 0.15; line-height: 1;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    .content { position: relative; z-index: 1; }
    .tag { font-family: 'Share Tech Mono', monospace; color: var(--accent); font-size: 0.85rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { color: var(--muted); margin-bottom: 2rem; }
    a {
      display: inline-block; border: 1px solid var(--accent); color: var(--accent);
      padding: 0.75rem 2rem; font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem; text-decoration: none; border-radius: 4px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(100,255,218,0.1); }
    .glitch { animation: glitch 2s infinite; }
    @keyframes glitch {
      0%, 90%, 100% { text-shadow: none; }
      91% { text-shadow: -2px 0 #ff0066, 2px 0 var(--accent); }
      93% { text-shadow: 2px 0 #ff0066, -2px 0 var(--accent); }
    }
  </style>
</head>
<body>
  <div class="err-code">404</div>
  <div class="content">
    <p class="tag">// ERROR 404</p>
    <h1 class="glitch">Page Not Found</h1>
    <p>Looks like this page doesn't exist — or it's been moved.<br>Let's get you back on track.</p>
    <a href="/">← Return to Home</a>
  </div>
</body>
</html>
